<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1f">
<title>Game Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎮%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d1f;--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);--txt:#f2f4ff;--muted:#a3abd1;--a:#7c5cff;--b:#ff5cb8;--ok:#3ddc97;--bad:#ff5d73;--warn:#ffc857;--r:18px;--font:'Fredoka',ui-rounded,'Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:16px}
body{background:radial-gradient(1200px 700px at 12% -10%,#2a1a6e55,transparent 60%),radial-gradient(900px 600px at 100% 10%,#ff5cb844,transparent 55%),radial-gradient(900px 700px at 50% 120%,#18b6ff33,transparent 60%),var(--bg);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff6 1px,transparent 1.5px),radial-gradient(#fff4 1px,transparent 1.5px);background-size:90px 90px,140px 140px;background-position:0 0,40px 60px;opacity:.25;animation:drift 90s linear infinite}
@keyframes drift{to{background-position:0 900px,40px 960px}}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600}
.muted{color:var(--muted)}.center{text-align:center}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:10px}.spacer{flex:1}.hide{display:none!important}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 40px #0004}
.btn{border:0;cursor:pointer;border-radius:999px;padding:11px 22px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 24px #7c5cff55;transition:transform .12s,filter .12s,box-shadow .12s}
.btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1)}.btn:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.alt{background:var(--card2);box-shadow:none;border:1px solid var(--line)}.btn.sm{padding:6px 14px;font-size:14px}.btn.big{padding:18px 44px;font-size:24px}
.btn.ok{background:linear-gradient(135deg,#1fbf7a,#3ddc97)}.btn.bad{background:linear-gradient(135deg,#e0405a,#ff7a5d)}
.pl{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 70%,transparent);font-weight:500;white-space:nowrap}
.pl:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.pl.off{opacity:.4}.pl.me{outline:2px solid #fff6}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c);vertical-align:middle}
input[type=text],input:not([type]),input[type=number]{background:#0006;border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:none;min-width:0}
input:focus{border-color:var(--a);box-shadow:0 0 0 3px #7c5cff44}
/* landing */
.landing{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center}
.logo{font-size:clamp(44px,9vw,92px);font-weight:700;letter-spacing:-1px;line-height:1}
.logo b{background:linear-gradient(135deg,#a58bff,#ff7ac8);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .pad{display:inline-block;animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
.tag{font-size:clamp(16px,2.4vw,22px);color:var(--muted);max-width:520px;margin:0}
.btn.big.pulse{animation:pulse 2.2s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 #7c5cff88}70%{box-shadow:0 0 0 24px #7c5cff00}100%{box-shadow:0 0 0 0 #7c5cff00}}
.marq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:760px;opacity:.85}.marq span{background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:999px;font-size:14px}
/* join by code */
.or{display:flex;align-items:center;gap:12px;width:min(420px,88vw);color:var(--muted);font-size:14px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.joinbox{display:flex;gap:10px;width:min(420px,88vw)}.joinbox input{flex:1;text-align:center;font:600 22px ui-monospace,Menlo,monospace;letter-spacing:6px;text-transform:uppercase;padding:12px 8px}.joinbox .btn{padding:12px 26px}
.shake{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.bigcode{display:flex;flex-direction:column;align-items:center;margin:10px 0 4px;padding:10px;border-radius:14px;background:#0004;border:1px dashed var(--line)}.bigcode small{color:var(--muted)}.bigcode b{font:700 clamp(34px,8vw,48px) ui-monospace,Menlo,monospace;letter-spacing:10px;padding-left:10px;background:linear-gradient(135deg,#a58bff,#ff7ac8);-webkit-background-clip:text;background-clip:text;color:transparent}
/* room shell */
.top{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;padding:10px 16px;background:#0b0d1fcc;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:20px}.brand b{color:#b9a6ff}
.code{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);padding:4px 6px 4px 14px;border-radius:999px}
.code b{letter-spacing:3px;font-size:18px}
.pbar{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.lobby{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:16px;align-items:start}
@media(max-width:860px){.lobby{grid-template-columns:1fr}}
.linkbox{display:flex;gap:8px;margin:12px 0 6px}.linkbox input{flex:1}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.prow{display:flex;gap:8px;align-items:center;justify-content:space-between}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px}.x:hover{color:var(--bad)}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.cat{border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:14px}.cat.on{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.gcard{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s,background .15s;min-height:132px}
.gcard:hover:not(.dis){transform:translateY(-3px);border-color:var(--a);background:var(--card2)}
.gcard .ic{font-size:34px;line-height:1}.gcard .nm{font-weight:600;font-size:17px}.gcard .bl{font-size:13px;color:var(--muted);line-height:1.3}
.gcard .pc{font-size:12px;color:var(--muted);margin-top:auto}.gcard.dis{opacity:.45;cursor:not-allowed}.gcard.view{cursor:default}
.gcard .tg{position:absolute;right:10px;top:10px;font-size:11px;padding:2px 8px;border-radius:999px;background:#0006}
/* briefing */
.brief{max-width:720px;margin:20px auto;display:flex;flex-direction:column;gap:16px}
.brief h1{font-size:clamp(28px,5vw,44px)}.brief .ic{font-size:64px}
.how{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.how li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;font-size:18px;line-height:1.4}
.how li:before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-weight:700;font-size:15px;margin-top:1px}
.rdy{display:flex;gap:8px;flex-wrap:wrap}.rdy .pl.ok:after{content:"✔";color:var(--ok);font-weight:700}.rdy .pl.wait{opacity:.55}
/* game area */
.gamebar{display:flex;align-items:center;gap:12px;margin-bottom:12px}.gtitle{font-size:22px;font-weight:600}
.gamearea{position:relative;min-height:300px}
.overlay{position:fixed;inset:0;background:#05061499;backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.result{min-width:min(92vw,420px);max-width:520px;text-align:center;display:flex;flex-direction:column;gap:14px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.result h2{font-size:30px}.result ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left}
.result li{display:flex;justify-content:space-between;gap:12px;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1f45;border:1px solid var(--line);padding:10px 18px;border-radius:999px;z-index:99;box-shadow:0 10px 30px #0008;animation:pop .3s}
.banner{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--warn);color:#2a2000;text-align:center;padding:6px;font-weight:600}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
/* shared game helpers */
.stack{display:flex;flex-direction:column;gap:12px;align-items:center}
.turn{font-size:20px;font-weight:600;text-align:center;padding:8px 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:inline-block}
.turn.mine{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;animation:pulse 1.6s infinite}
.board{display:grid;gap:3px;background:#0005;padding:8px;border-radius:16px;border:1px solid var(--line)}
.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;background:var(--card);border:0;font-size:clamp(20px,6vw,44px);font-weight:700;cursor:pointer;transition:background .12s,transform .12s;padding:0;color:inherit}
.cell:hover:not(:disabled){background:var(--card2);transform:scale(1.04)}.cell:disabled{cursor:default}
.scores{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.score{padding:6px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;gap:8px;align-items:center}.score b{font-size:20px}
.score.cur{border-color:#fff;box-shadow:0 0 18px #fff4}
.big{font-size:clamp(28px,7vw,64px);font-weight:700}
.bar{height:14px;border-radius:99px;background:#0006;overflow:hidden;border:1px solid var(--line)}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .2s}
.kbd{display:inline-block;padding:1px 8px;border-radius:6px;background:#0006;border:1px solid var(--line);font-size:13px}
.canvaswrap{width:100%;display:grid;place-items:center}.canvaswrap canvas{max-width:100%;border-radius:16px;border:1px solid var(--line);background:#000;touch-action:none}
.loading{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<script src="three.min.js"></script><script src="peerjs.min.js"></script><script src="roomengine.js"></script>
<script src="core.js"></script><script src="p2p.js"></script>
<script src="games.js"></script>
</body>
</html>
